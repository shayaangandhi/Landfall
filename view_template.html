<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Landfall — Demo</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #0a0e14;
    --bg-panel: #11161d;
    --bg-panel-raised: #161c25;
    --text: #f3f5f7;
    --text-dim: #b7c0cc;
    --border: #2a323d;
    --closed: #3ddc84;
    --closed-bg: #103321;
    --open-escalation: #ffb545;
    --open-escalation-bg: #332507;
    --open-plain: #e7ebef;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    --sans: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  .shell {
    max-width: 1560px;
    width: 100%;
    margin: 0 auto;
    padding: 20px 32px 64px;
    flex: 1;
  }

  /* ---- header / step control ---------------------------------- */

  .topbar {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 18px;
    gap: 20px;
  }

  .title-block {
    display: flex;
    align-items: baseline;
    gap: 10px;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .title-block .brand {
    font-size: 20px;
    font-weight: 800;
    color: var(--text-dim);
    letter-spacing: 0.02em;
  }

  .title-block .subtitle {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-dim);
    opacity: 0.7;
  }

  /* ---- two-column layout ----------------------------------------- */

  .layout {
    display: grid;
    grid-template-columns: 55fr 45fr;
    gap: 28px;
    align-items: start;
  }

  .col-ledger, .col-side {
    min-width: 0; /* allow grid children to shrink below content width */
  }

  .step-label {
    font-size: 15px;
    font-weight: 600;
    color: var(--text-dim);
  }

  .step-label strong {
    color: var(--text);
    font-size: 17px;
  }

  /* ---- invoice ledger ------------------------------------------- */

  .ledger {
    display: grid;
    gap: 6px;
  }

  .invoice-row {
    display: grid;
    grid-template-columns: 100px 130px 120px 110px 1fr;
    align-items: center;
    gap: 14px;
    padding: 6px 18px;
    border-radius: 8px;
    background: var(--bg-panel);
    border: 2px solid var(--border);
    transition: border-color 0.2s, background 0.2s;
  }

  .invoice-row .id {
    font-family: var(--mono);
    font-weight: 700;
    font-size: 20px;
  }

  .invoice-row .customer {
    font-size: 17px;
    color: var(--text-dim);
    font-weight: 600;
  }

  .invoice-row .amount {
    font-family: var(--mono);
    font-size: 20px;
    font-weight: 700;
    text-align: right;
  }

  .invoice-row .status {
    font-size: 15px;
    font-weight: 800;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 6px 14px;
    border-radius: 999px;
    text-align: center;
    justify-self: start;
  }

  .invoice-row .note {
    font-size: 14px;
    color: var(--text-dim);
  }

  .invoice-row.status-closed {
    border-color: var(--closed);
  }
  .invoice-row.status-closed .status {
    background: var(--closed-bg);
    color: var(--closed);
  }

  .invoice-row.status-escalated {
    border-color: var(--open-escalation);
  }
  .invoice-row.status-escalated .status {
    background: var(--open-escalation-bg);
    color: var(--open-escalation);
  }

  .invoice-row.status-open {
    border-color: var(--border);
  }
  .invoice-row.status-open .status {
    background: #1c232c;
    color: var(--open-plain);
  }

  /* ---- escalation card -------------------------------------------- */

  .escalation-card {
    background: linear-gradient(180deg, var(--bg-panel-raised), var(--bg-panel));
    border: 3px solid var(--open-escalation);
    border-radius: 16px;
    padding: 22px 28px;
    margin-bottom: 20px;
    box-shadow: 0 0 0 1px rgba(255, 181, 69, 0.15), 0 20px 60px rgba(0,0,0,0.4);
  }

  .escalation-card .header {
    font-size: 15px;
    font-weight: 800;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--open-escalation);
    margin-bottom: 4px;
  }

  .escalation-card .headline {
    font-size: 26px;
    font-weight: 700;
    margin-bottom: 14px;
    font-family: var(--mono);
  }

  .card-field {
    display: grid;
    grid-template-columns: 170px 1fr;
    gap: 20px;
    padding: 16px 0;
    border-top: 1px solid var(--border);
    align-items: start;
  }

  .card-field:first-of-type {
    border-top: none;
  }

  .card-field .label {
    font-size: 15px;
    font-weight: 800;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--text-dim);
    padding-top: 2px;
  }

  .card-field .value {
    font-size: 21px;
    line-height: 1.45;
    font-weight: 600;
  }

  .card-field .value .sub {
    display: block;
    font-size: 17px;
    color: var(--text-dim);
    font-weight: 500;
    margin-top: 6px;
  }

  .card-field.confidence .value {
    font-weight: 800;
  }
  .card-field.confidence .value.low { color: var(--open-escalation); }
  .card-field.confidence .value.medium { color: #ffd480; }
  .card-field.confidence .value.high { color: var(--closed); }

  .no-escalation {
    text-align: center;
    padding: 40px;
    color: var(--text-dim);
    font-size: 18px;
    font-weight: 600;
    border: 2px dashed var(--border);
    border-radius: 16px;
    margin-bottom: 40px;
  }

  /* ---- refund panel ------------------------------------------------ */

  .deposit-card {
    background: var(--bg-panel);
    border: 2px solid var(--border);
    border-radius: 14px;
    padding: 14px 20px;
    margin-bottom: 16px;
  }

  .deposit-card .header {
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 8px;
  }

  .deposit-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px 20px;
    margin-bottom: 8px;
  }

  .deposit-stat .k {
    font-size: 13px;
    color: var(--text-dim);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 4px;
  }

  .deposit-stat .v {
    font-size: 17px;
    font-weight: 700;
    font-family: var(--mono);
  }

  .deposit-card .outcome {
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    padding-top: 8px;
    border-top: 1px solid var(--border);
  }

  .refund-panel {
    background: var(--bg-panel);
    border: 3px solid var(--closed);
    border-radius: 16px;
    padding: 18px 24px;
    margin-bottom: 16px;
  }

  .refund-panel .header {
    font-size: 14px;
    font-weight: 800;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--closed);
    margin-bottom: 10px;
  }

  .refund-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px 20px;
  }

  .refund-stat .k {
    font-size: 12px;
    color: var(--text-dim);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 3px;
  }

  .refund-stat .v {
    font-size: 17px;
    font-weight: 700;
    font-family: var(--mono);
  }

  .refund-stat .v.status-pill {
    display: inline-block;
    color: var(--closed);
    background: var(--closed-bg);
    padding: 4px 14px;
    border-radius: 999px;
    font-family: var(--sans);
  }

  .refund-stat .v.rejected {
    color: var(--closed);
  }

  /* ---- raw API response blocks ---------------------------------- */
  /* This replaces terminal footage in the video - the real response
     bodies have to be legible at 1080p on their own, not a screen
     recording of a terminal. */

  .raw-response {
    margin-top: 12px;
    padding-top: 10px;
    border-top: 1px solid var(--border);
  }

  .raw-label {
    font-size: 13px;
    font-weight: 700;
    color: var(--text-dim);
    letter-spacing: 0.02em;
    margin-bottom: 6px;
  }

  .raw-json {
    background: #05070a;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 16px;
    margin: 0;
    font-family: var(--mono);
    font-size: 16px;
    line-height: 1.4;
    color: #b8f2c9;
    overflow-x: auto;
    white-space: pre;
  }

  /* ---- step control -------------------------------------------- */

  .stepper {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: rgba(10, 14, 20, 0.95);
    border-top: 1px solid var(--border);
    backdrop-filter: blur(6px);
    padding: 18px 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 28px;
  }

  .stepper button {
    background: var(--bg-panel-raised);
    border: 2px solid var(--border);
    color: var(--text);
    font-size: 16px;
    font-weight: 700;
    padding: 12px 28px;
    border-radius: 10px;
    cursor: pointer;
    font-family: var(--sans);
  }

  .stepper button:hover:not(:disabled) {
    border-color: var(--text-dim);
  }

  .stepper button:disabled {
    opacity: 0.35;
    cursor: default;
  }

  .stepper .dots {
    display: flex;
    gap: 10px;
  }

  .stepper .dot {
    width: 11px;
    height: 11px;
    border-radius: 50%;
    background: var(--border);
    cursor: pointer;
  }

  .stepper .dot.active {
    background: var(--open-escalation);
    transform: scale(1.3);
  }

  .stepper .counter {
    font-size: 15px;
    color: var(--text-dim);
    font-weight: 700;
    min-width: 70px;
    text-align: center;
  }

  .mode-toggle {
    display: inline-flex;
    border: 2px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    flex-shrink: 0;
  }

  .mode-toggle button {
    background: var(--bg-panel);
    border: none;
    color: var(--text-dim);
    font-family: var(--sans);
    font-size: 14px;
    font-weight: 700;
    padding: 10px 18px;
    cursor: pointer;
  }

  .mode-toggle button.active {
    background: var(--open-escalation-bg);
    color: var(--open-escalation);
  }

  .mode-toggle button#mode-rules.active {
    background: var(--closed-bg);
    color: var(--closed);
  }
</style>
</head>
<body>

<div class="shell">
  <div class="topbar">
    <div class="title-block">
      <span class="brand">Landfall</span>
      <span class="subtitle">Ravenswood Roasters</span>
    </div>
    <div class="mode-toggle" id="mode-toggle">
      <button id="mode-agent" class="active">Agent judgment</button>
      <button id="mode-rules">Rules-only</button>
    </div>
    <div class="step-label" id="step-label"></div>
  </div>

  <div class="layout">
    <div class="col-ledger">
      <div id="ledger" class="ledger"></div>
    </div>
    <div class="col-side">
      <div id="deposit-area"></div>
      <div id="escalation-area"></div>
      <div id="refund-area"></div>
    </div>
  </div>
</div>

<div class="stepper">
  <button id="prev">&larr; Prev</button>
  <div class="dots" id="dots"></div>
  <div class="counter" id="counter"></div>
  <button id="next">Next &rarr;</button>
</div>

<script>
  const SNAPSHOTS_AGENT = /*__SNAPSHOTS_AGENT_JSON__*/[];
  const SNAPSHOTS_RULES_ONLY = /*__SNAPSHOTS_RULES_ONLY_JSON__*/[];

  let mode = "agent";
  let SNAPSHOTS = SNAPSHOTS_AGENT.length ? SNAPSHOTS_AGENT : SNAPSHOTS_RULES_ONLY;
  let current = 0;

  function setMode(next) {
    mode = next;
    SNAPSHOTS = mode === "agent" ? SNAPSHOTS_AGENT : SNAPSHOTS_RULES_ONLY;
    current = 0;
    document.getElementById("mode-agent").classList.toggle("active", mode === "agent");
    document.getElementById("mode-rules").classList.toggle("active", mode === "rules");
    render();
  }

  function fmtMoney(n, currency) {
    return "$" + Number(n).toLocaleString("en-US", {minimumFractionDigits: 2, maximumFractionDigits: 2}) + " " + (currency || "USD");
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;"}[c]));
  }

  function statusClass(inv, escalatedIds) {
    if (inv.status === "CLOSED") return "status-closed";
    if (escalatedIds.has(inv.id)) return "status-escalated";
    return "status-open";
  }

  function statusText(inv, escalatedIds) {
    if (inv.status === "CLOSED") return "Closed";
    if (escalatedIds.has(inv.id)) return "Escalated";
    return "Open";
  }

  function renderLedger(snap) {
    const escalatedIds = new Set();
    (snap.escalations || []).forEach(card => {
      (card.related_invoice_ids || []).forEach(id => escalatedIds.add(id));
    });

    const el = document.getElementById("ledger");
    el.innerHTML = "";
    snap.ledger.forEach(inv => {
      const row = document.createElement("div");
      row.className = "invoice-row " + statusClass(inv, escalatedIds);
      row.innerHTML = `
        <div class="id">${inv.id}</div>
        <div class="customer">${inv.customer}</div>
        <div class="amount">${fmtMoney(inv.amount, "USD")}</div>
        <div class="status">${statusText(inv, escalatedIds)}</div>
        <div class="note">${inv.note || ""}</div>
      `;
      el.appendChild(row);
    });
  }

  function confClass(level) {
    return (level || "unknown").toLowerCase();
  }

  function renderEscalationCard(card) {
    const supporting = (card.supporting || []).map(s => `<span class="sub">${s}</span>`).join("");
    return `
      <div class="escalation-card">
        <div class="header">Escalation</div>
        <div class="headline">Deposit ${card.deposit_label} · ${fmtMoney(card.amount, card.currency)} · ${card.counterparty}</div>

        <div class="card-field">
          <div class="label">Proposed</div>
          <div class="value">${card.proposed}</div>
        </div>

        ${card.rejected ? `
        <div class="card-field">
          <div class="label">Rejected</div>
          <div class="value">${card.rejected}</div>
        </div>` : ""}

        ${card.supporting && card.supporting.length ? `
        <div class="card-field">
          <div class="label">Supporting</div>
          <div class="value">${supporting}</div>
        </div>` : ""}

        ${card.unproven ? `
        <div class="card-field">
          <div class="label">Unproven</div>
          <div class="value">${card.unproven}</div>
        </div>` : ""}

        <div class="card-field confidence">
          <div class="label">Confidence</div>
          <div class="value ${confClass(card.confidence)}">${(card.confidence || "unknown").replace(/^./, c => c.toUpperCase())} — needs a person.</div>
        </div>
      </div>
    `;
  }

  function renderEscalationArea(snap) {
    const el = document.getElementById("escalation-area");
    const cards = snap.escalations || [];
    if (!cards.length) {
      // Collapse entirely rather than render a placeholder box - most
      // steps have no open escalation, and a dashed box every time reads
      // as a missing feature, not an absence of one.
      el.innerHTML = "";
      return;
    }
    el.innerHTML = cards.map(renderEscalationCard).join("");
  }

  function renderDepositArea(snap) {
    const el = document.getElementById("deposit-area");
    const d = snap.deposit;
    if (!d) { el.innerHTML = ""; return; }
    const acctLabel = d.account_customer
      ? `${d.account_customer} · …${d.account_id_last5 || "?????"}`
      : "unknown account";
    el.innerHTML = `
      <div class="deposit-card">
        <div class="header">Deposit landed</div>
        <div class="deposit-grid">
          <div class="deposit-stat">
            <div class="k">Amount</div>
            <div class="v">${fmtMoney(d.amount, d.currency)}</div>
          </div>
          <div class="deposit-stat">
            <div class="k">Payer</div>
            <div class="v">${d.payer || "—"}</div>
          </div>
          <div class="deposit-stat">
            <div class="k">Landed in</div>
            <div class="v">${acctLabel}</div>
          </div>
          <div class="deposit-stat">
            <div class="k">Reference</div>
            <div class="v">${d.reference || "—"}</div>
          </div>
        </div>
        <div class="outcome">${d.outcome || ""}</div>
      </div>
    `;
  }

  function renderRefundArea(snap) {
    const el = document.getElementById("refund-area");
    const r = snap.refund;
    if (!r) { el.innerHTML = ""; return; }
    el.innerHTML = `
      <div class="refund-panel">
        <div class="header">Refund executed · ${r.invoice_id}</div>
        <div class="refund-grid">
          <div class="refund-stat">
            <div class="k">Transfer ID</div>
            <div class="v">${r.transfer_id}</div>
          </div>
          <div class="refund-stat">
            <div class="k">Status</div>
            <div class="v status-pill">${r.status}</div>
          </div>
          <div class="refund-stat">
            <div class="k">Amount</div>
            <div class="v">${fmtMoney(r.amount, r.currency)}</div>
          </div>
          <div class="refund-stat">
            <div class="k">Duplicate attempt</div>
            <div class="v rejected">${r.duplicate_attempt && r.duplicate_attempt.rejected ? "Rejected (" + r.duplicate_attempt.code + ")" : "not tested"}</div>
          </div>
        </div>
        ${r.transfer_response ? `
        <div class="raw-response">
          <div class="raw-label">GET /transfers/${escapeHtml(r.transfer_id)} &middot; reached ${escapeHtml(r.status)}
            <span style="opacity:0.6; font-weight:500;">(trimmed to the fields that prove it)</span></div>
          <pre class="raw-json">${escapeHtml(JSON.stringify({
            id: r.transfer_response.id,
            status: r.transfer_response.status,
            transfer_amount: r.transfer_response.transfer_amount,
            request_id: r.transfer_response.request_id,
          }, null, 2))}</pre>
        </div>` : ""}
        ${r.duplicate_response ? `
        <div class="raw-response">
          <div class="raw-label">POST /transfers/create &middot; same request_id, replayed &middot; rejected</div>
          <pre class="raw-json">${escapeHtml(JSON.stringify(r.duplicate_response, null, 2))}</pre>
        </div>` : ""}
      </div>
    `;
  }

  function renderStepper() {
    document.getElementById("prev").disabled = current === 0;
    document.getElementById("next").disabled = current === SNAPSHOTS.length - 1;
    document.getElementById("counter").textContent = (current + 1) + " / " + SNAPSHOTS.length;
    const dots = document.getElementById("dots");
    dots.innerHTML = "";
    SNAPSHOTS.forEach((s, i) => {
      const d = document.createElement("div");
      d.className = "dot" + (i === current ? " active" : "");
      d.title = s.step;
      d.addEventListener("click", () => goTo(i));
      dots.appendChild(d);
    });
  }

  function render() {
    const snap = SNAPSHOTS[current];
    document.getElementById("step-label").innerHTML = `Step <strong>${snap.step}</strong> — ${snap.description || ""}`;
    renderDepositArea(snap);
    renderLedger(snap);
    renderEscalationArea(snap);
    renderRefundArea(snap);
    renderStepper();
  }

  function goTo(i) {
    if (i < 0 || i >= SNAPSHOTS.length) return;
    current = i;
    render();
  }

  document.getElementById("prev").addEventListener("click", () => goTo(current - 1));
  document.getElementById("next").addEventListener("click", () => goTo(current + 1));
  document.getElementById("mode-agent").addEventListener("click", () => setMode("agent"));
  document.getElementById("mode-rules").addEventListener("click", () => setMode("rules"));
  window.addEventListener("keydown", e => {
    if (e.key === "ArrowLeft") goTo(current - 1);
    if (e.key === "ArrowRight") goTo(current + 1);
  });

  // Hide the toggle entirely if only one mode's data is present - e.g.
  // before rules_only.py has ever run, there's nothing to switch to.
  if (!SNAPSHOTS_AGENT.length || !SNAPSHOTS_RULES_ONLY.length) {
    document.getElementById("mode-toggle").style.display = "none";
  } else {
    setMode("agent");
  }

  render();
</script>

</body>
</html>
